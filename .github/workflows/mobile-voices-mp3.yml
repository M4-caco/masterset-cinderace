name: Gerar MP3 compativel para saudacoes do Pokemon
on:
  push:
    branches: [fix/mobile-pokemon-welcome-and-navigation]
    paths: ['.github/workflows/mobile-voices-mp3.yml']
permissions:
  contents: write
jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-pokemon-welcome-and-navigation
          persist-credentials: true
      - name: Gerar os MP3 com fidelidade aos OGG existentes
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          for pokemon in scorbunny raboot cinderace; do
            ffmpeg -nostdin -hide_banner -loglevel error -y               -i "pokemon/audio/jornadas/${pokemon}.ogg"               -codec:a libmp3lame -q:a 3               "pokemon/audio/jornadas/${pokemon}.mp3"
          done
          for pokemon in scorbunny raboot cinderace; do
            test -s "pokemon/audio/jornadas/${pokemon}.mp3"
          done
      - name: Salvar arquivos convertidos somente na branch de teste
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pokemon/audio/jornadas/scorbunny.mp3 pokemon/audio/jornadas/raboot.mp3 pokemon/audio/jornadas/cinderace.mp3
          if ! git diff --cached --quiet; then
            git commit -m "audio(pokemon): add Safari MP3 fallbacks to PT-BR greetings"
            git push origin HEAD:fix/mobile-pokemon-welcome-and-navigation
          fi
