name: Pokémon 3D smoke test

on:
  push:
    branches:
      - main
      - fix/cinderace-shiny-eye-edge-artifacts-v4
      - fix/cinderace-shiny-face-attack-anchors
      - feature/max-landing-impact
      - fix/gigamax-tap-ground-fire
    paths:
      - 'pokemon/**'
      - 'tests/pokemon-*.mjs'
      - '.github/workflows/pokemon-max-landing-test.yml'
      - 'index.html'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  max-impact:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar sintaxe dos módulos JavaScript alterados
        run: |
          node --check pokemon/face-animation.js
          node --check pokemon/showcase.js
          node --check pokemon/battle-effects.js
          node --check pokemon/ground-fire.js
          node --check pokemon/entry.js
      - name: Conferir olhos originais Shiny do Cinderace
        run: node tests/pokemon-face-shiny.mjs
      - name: Testar colisão e limpeza de partículas Max
        run: node tests/pokemon-max-landing.mjs
      - name: Testar fogo 3D de contato e toque Gigamax
        run: node tests/pokemon-ground-fire.mjs
      - name: Testar ancoragem dos golpes Pokémon
        run: node tests/pokemon-effect-space.mjs
      - name: Testar gestos dos ataques
        run: node tests/pokemon-tap-gestures.mjs

      - name: Diagnosticar camadas do rosto Shiny no Chromium (temporário)
        run: |
          python -m pip install --quiet playwright Pillow
          (python -m http.server 8765 --bind 127.0.0.1 >/tmp/scorace-http.log 2>&1 &)
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          from PIL import Image, ImageDraw
          import io,base64
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,executable_path='/usr/bin/google-chrome',args=['--no-sandbox','--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader','--disable-dev-shm-usage'])
              page=browser.new_page(viewport={'width':1440,'height':900})
              errors=[]
              page.on('pageerror',lambda e:errors.append(str(e)))
              page.goto('http://127.0.0.1:8765/',wait_until='domcontentloaded')
              page.locator('#nav-pokemon').click()
              card=page.locator('#pokemon-lineup .pokemon-viewer').nth(1)
              card.locator('.pokemon-stage[data-ready]').wait_for(timeout=30000)
              card.locator('button.pokemon-target').click()
              page.locator('#pokemon-inspector .pokemon-controls').nth(1).locator('.pokemon-colors button').nth(1).click()
              page.wait_for_timeout(1100)
              stage=card.locator('.pokemon-stage')
              versions=['current','noComposite','faceBaseMagenta','bodyMagenta','noFaceBase','noBoth']
              imgs=[]
              for variant in versions:
                  info=page.evaluate("""variant => {
                    const v=window.__scoraceFaceDebug;
                    if (!v?.model) return {error:'no model'};
                    v.rotate(0);
                    const names=[];
                    for(const [mesh,normal,rare] of v.model.materialPairs) {
                      if (normal.name.includes('_Face') || normal.name==='BodyAll') {
                        rare.color.set(normal.name.endsWith('_FaceBase')?'#98918a':'#ffffff');
                        rare.opacity=1;
                        rare.transparent=normal.name.endsWith('_FaceComposite');
                        rare.depthWrite=!rare.transparent;
                        if (variant==='noComposite' && normal.name.endsWith('_FaceComposite')) {
                          rare.opacity=0;
                        }
                        if (variant==='faceBaseMagenta' && normal.name.endsWith('_FaceBase'))
                          rare.color.set('#ff00ff');
                        if (variant==='bodyMagenta' && normal.name==='BodyAll')
                          rare.color.set('#ff00ff');
                        if ((variant==='noFaceBase'||variant==='noBoth') &&
                            normal.name.endsWith('_FaceBase')) {
                          rare.opacity=0;rare.transparent=true;rare.depthWrite=false;
                        }
                        if (variant==='noBoth' && normal.name.endsWith('_FaceComposite'))rare.opacity=0;
                        rare.needsUpdate=true;
                        names.push([normal.name,mesh.material===rare,rare.color.getHexString(),rare.opacity]);
                      }
                    }
                    v.invalidate();
                    return {names};
                  }""",variant)
                  page.wait_for_timeout(260)
                  image=Image.open(io.BytesIO(stage.screenshot())).convert('RGB')
                  cut=image.crop((int(image.width*.26),int(image.height*.53),
                     int(image.width*.74),int(image.height*.79)))
                  cut=cut.resize((cut.width*3,cut.height*3))
                  imgs.append((variant,cut))
                  print('FACE_LAYER',variant,info)
              cw=max(im.width for _,im in imgs)+10
              ch=max(im.height for _,im in imgs)+32
              sheet=Image.new('RGB',(cw*3,ch*2),(85,85,85))
              draw=ImageDraw.Draw(sheet)
              for i,(label,im) in enumerate(imgs):
                  x=(i%3)*cw;y=(i//3)*ch
                  sheet.paste(im,(x,y+26))
                  draw.text((x+8,y+5),label,fill='white')
              stream=io.BytesIO()
              sheet.save(stream,format='JPEG',quality=79,optimize=True)
              print('FACE_QA_BROWSER_ERRORS',errors[:5])
              print('FACE_VARIANTS_JPEG_BEGIN')
              print(base64.b64encode(stream.getvalue()).decode())
              print('FACE_VARIANTS_JPEG_END')
              browser.close()
          PY