name: Pokémon 3D smoke test

on:
  push:
    branches:
      - main
      - fix/cinderace-shiny-face-reference-v2
      - fix/cinderace-shiny-face-attack-anchors
      - feature/max-landing-impact
      - fix/gigamax-tap-ground-fire
    paths:
      - 'pokemon/**'
      - 'tests/pokemon-*.mjs'
      - '.github/workflows/pokemon-max-landing-test.yml'
      - 'index.html'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  max-impact:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar sintaxe dos módulos JavaScript alterados
        run: |
          node --check pokemon/face-animation.js
          node --check pokemon/showcase.js
          node --check pokemon/battle-effects.js
          node --check pokemon/ground-fire.js
          node --check pokemon/entry.js
      - name: Conferir olhos originais Shiny do Cinderace
        run: node tests/pokemon-face-shiny.mjs
      - name: Testar colisão e limpeza de partículas Max
        run: node tests/pokemon-max-landing.mjs
      - name: Testar fogo 3D de contato e toque Gigamax
        run: node tests/pokemon-ground-fire.mjs
      - name: Testar ancoragem dos golpes Pokémon
        run: node tests/pokemon-effect-space.mjs
      - name: Testar gestos dos ataques
        run: node tests/pokemon-tap-gestures.mjs
      - name: Preview temporário da textura Shiny (diagnóstico)
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          import json,io
          from PIL import Image
          j=json.load(open('pokemon/models/cinderace.gltf'))
          b=open('pokemon/models/cinderace-2.bin','rb').read()
          for i,name in [(5,'base'),(7,'original')]:
              v=j['bufferViews'][j['images'][i]['bufferView']]
              raw=b[v['byteOffset']:v['byteOffset']+v['byteLength']]
              im=Image.open(io.BytesIO(raw)).convert('RGBA').resize((256,256))
              open('/tmp/'+name+'.rgba','wb').write(im.tobytes())
          atlas=Image.open('pokemon/visuals/cinderace-face-shiny.webp').convert('RGBA')
          for i in range(3):
              im=atlas.crop((0,i*256,256,(i+1)*256))
              open('/tmp/pose'+str(i)+'.rgba','wb').write(im.tobytes())
          PY
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          import { composeShinyEyePixels } from './pokemon/face-animation.js';
          const native=new Uint8ClampedArray(fs.readFileSync('/tmp/original.rgba'));
          for(let i=0;i<3;i++){
            const pose=new Uint8ClampedArray(fs.readFileSync('/tmp/pose'+i+'.rgba'));
            const pixels=composeShinyEyePixels(native,pose,256,256);
            fs.writeFileSync('/tmp/out'+i+'.rgba',Buffer.from(pixels));
          }
          JS
          python - <<'PY'
          import base64,io
          from PIL import Image
          base=Image.frombytes('RGBA',(256,256),open('/tmp/base.rgba','rb').read())
          result=Image.new('RGBA',(768,256))
          for i in range(3):
              eye=Image.frombytes('RGBA',(256,256),open('/tmp/out'+str(i)+'.rgba','rb').read())
              frame=base.copy()
              frame.alpha_composite(eye)
              result.paste(frame,(i*256,0))
          bio=io.BytesIO()
          result.convert('RGB').save(bio,format='PNG',optimize=True)
          print('PREVIEW_PNG_BASE64_START')
          print(base64.b64encode(bio.getvalue()).decode())
          print('PREVIEW_PNG_BASE64_END')
          PY

      - name: Capturar cena 3D Shiny no Chromium (diagnóstico)
        run: |
          python -m pip install --quiet playwright Pillow
          (python -m http.server 8765 --bind 127.0.0.1 >/tmp/scorace-http.log 2>&1 &)
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          from PIL import Image
          import io,base64
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True, executable_path='/usr/bin/google-chrome', args=[
                  '--no-sandbox', '--use-gl=angle', '--use-angle=swiftshader',
                  '--enable-unsafe-swiftshader', '--disable-dev-shm-usage'])
              page=browser.new_page(viewport={'width':1440,'height':900},device_scale_factor=1)
              failures=[]
              page.on('pageerror',lambda e:failures.append(str(e)))
              page.goto('http://127.0.0.1:8765/',wait_until='domcontentloaded')
              page.locator('#nav-pokemon').click()
              page.locator('#pokemon-lineup .pokemon-viewer').nth(1).locator('.pokemon-stage[data-ready]').wait_for(timeout=30000)
              page.locator('#pokemon-lineup .pokemon-viewer').nth(1).locator('button.pokemon-target').click()
              page.locator('#pokemon-inspector .pokemon-controls').nth(1).locator('.pokemon-colors button').nth(1).click()
              page.wait_for_timeout(1300)
              stage=page.locator('#pokemon-lineup .pokemon-viewer').nth(1).locator('.pokemon-stage')
              shot=stage.screenshot()
              img=Image.open(io.BytesIO(shot)).convert('RGB')
              img.thumbnail((540,680))
              stream=io.BytesIO()
              img.save(stream,format='JPEG',quality=78,optimize=True)
              print('WEBGL_ERRORS',failures[:7])
              print('STAGE_SIZE',img.size)
              print('WEBGL_IMAGE_BASE64_START')
              print(base64.b64encode(stream.getvalue()).decode())
              print('WEBGL_IMAGE_BASE64_END')
              face=img.crop((int(img.width*.34),int(img.height*.53),
                             int(img.width*.66),int(img.height*.70)))
              face=face.resize((face.width*4,face.height*4))
              stream2=io.BytesIO()
              face.save(stream2,format='JPEG',quality=90)
              print('WEBGL_FACE_JPEG_BASE64_START')
              print(base64.b64encode(stream2.getvalue()).decode())
              print('WEBGL_FACE_JPEG_BASE64_END')
              browser.close()
          PY