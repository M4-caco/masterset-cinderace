name: Pokémon 3D smoke test

on:
  push:
    branches:
      - main
    paths:
      - 'pokemon/**'
      - 'tests/pokemon-*.mjs'
      - '.github/workflows/pokemon-max-landing-test.yml'
      - 'index.html'
  pull_request:
    branches:
      - main
    paths:
      - 'pokemon/**'
      - 'tests/pokemon-*.mjs'
      - '.github/workflows/pokemon-max-landing-test.yml'
      - 'index.html'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  max-impact:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar sintaxe dos módulos JavaScript alterados
        run: |
          node --check pokemon/face-animation.js
          node --check pokemon/showcase.js
          node --check pokemon/tap-gestures.mjs
          node --check pokemon/entry.js
          node --check pokemon/jornadas-voices.js
      - name: Conferir olhos originais Shiny do Cinderace
        run: node tests/pokemon-face-shiny.mjs
      - name: Testar colisão e limpeza de partículas Max
        run: node tests/pokemon-max-landing.mjs
      - name: Verificar remoção completa dos efeitos experimentais de golpes
        run: node tests/pokemon-no-attack-effects.mjs
      - name: Testar gestos dos ataques
        run: node tests/pokemon-tap-gestures.mjs
      - name: Verificar ícones reais dos golpes
        run: node tests/pokemon-move-icons.mjs
      - name: Instalar navegador para conferir ícones (somente PR)
        if: github.event_name == 'pull_request'
        run: npm install --no-save --no-package-lock --ignore-scripts playwright-core@1.56.0
      - name: Testar e capturar ícones em Chromium (somente PR)
        if: github.event_name == 'pull_request'
        run: node tests/pokemon-move-icons-browser.mjs
      - name: Verificar setas, audio repetido e legendas do mobile no Chromium
        if: github.event_name == 'pull_request'
        run: node tests/pokemon-mobile-carousel-browser.mjs
      - name: Comparar rosto Normal e Shiny reais no Chromium (somente PR)
        if: github.event_name == 'pull_request'
        run: node tests/pokemon-shiny-normal-source-browser.mjs
