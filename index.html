<!DOCTYPE html>
<html lang="pt-br" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex Master Set Tracker - Cinderace Family</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        cinder: {
                            white: '#EFEFEF',
                            yellow: '#F4D664',
                            orange: '#BB492E',
                            red: '#83382A',
                            dark: '#182234',
                            bg: '#0B0F17',
                            card: '#151C2C'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* GLASSMORPHISM BASE */
        .glass-panel {
            background: rgba(21, 28, 44, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        .light .glass-panel {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(187, 73, 46, 0.15);
            box-shadow: 0 8px 32px 0 rgba(187, 73, 46, 0.08);
        }

        .glass-card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0.01) 100%), rgba(21, 28, 44, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.07);
        }
        .light .glass-card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.9) 0%, rgba(255, 255, 255, 0.6) 100%);
            border: 1px solid rgba(187, 73, 46, 0.12);
        }

        .card-not-owned img { filter: grayscale(100%) opacity(0.35); transition: all 0.2s ease; }
        .card-not-owned:hover img { filter: grayscale(30%) opacity(0.8); }
        .card-owned img { filter: grayscale(0%) opacity(1); transition: all 0.2s ease; }
        .card-owned { border: 2px solid #22c55e !important; box-shadow: 0 0 20px rgba(34, 197, 94, 0.3); }
        .card-not-owned { border: 1px solid rgba(187, 73, 46, 0.2) !important; }
        
        #zoom-modal { transition: opacity 0.2s ease-in-out; }

        @keyframes slideInLeft {
            from { opacity: 0; transform: translateX(30px); }
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(-30px); }
            to { opacity: 1; transform: translateX(0); }
        }
        .slide-left { animation: slideInLeft 0.2s ease-out; }
        .slide-right { animation: slideInRight 0.2s ease-out; }

        .custom-scroll::-webkit-scrollbar { width: 5px; height: 5px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; border-radius: 8px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #BB492E; border-radius: 8px; }

        /* EFEITO DE REFLEXO / GLARE PADRÃO */
        .holo-glare-effect {
            background: linear-gradient(
                125deg,
                transparent 15%,
                rgba(255, 255, 255, 0.65) 35%,
                rgba(255, 100, 200, 0.35) 45%,
                rgba(0, 220, 255, 0.35) 55%,
                rgba(255, 230, 100, 0.35) 65%,
                transparent 85%
            );
            mix-blend-mode: overlay;
        }

        /* ESTILOS DO SWITCH TEMA LUA / SOL */
        .theme-switch-track {
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.15);
        }
        .dark .theme-switch-track {
            box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.6);
        }
        .theme-switch-thumb {
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }
        .dark .theme-switch-thumb {
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 dark:bg-cinder-bg dark:text-cinder-white min-h-screen font-sans transition-colors duration-200 relative overflow-x-hidden">

    <!-- ELEMENTOS DE LUZ AMBIENTE GLASSMORPHISM DE FUNDO -->
    <div class="fixed top-[-10%] left-[-10%] w-[40vw] h-[40vw] rounded-full bg-cinder-orange/15 blur-[120px] pointer-events-none"></div>
    <div class="fixed bottom-[-10%] right-[-10%] w-[40vw] h-[40vw] rounded-full bg-cinder-yellow/10 blur-[140px] pointer-events-none"></div>

    <!-- MODAL DE ZOOM CENTRALIZADO COM SETAS EXTERNAS SEGURAS -->
    <div id="zoom-modal" onclick="handleModalClick(event)" class="fixed inset-0 z-[9999] bg-black/85 backdrop-blur-xl flex items-center justify-center hidden opacity-0 pointer-events-none p-4">
        
        <!-- Botão Voltar Externo -->
        <button id="zoom-prev-btn" onclick="event.stopPropagation(); prevZoomCard()" class="hidden sm:flex absolute left-4 sm:left-8 lg:left-16 top-1/2 -translate-y-1/2 z-40 glass-panel hover:bg-cinder-orange disabled:opacity-20 text-cinder-orange dark:text-cinder-yellow hover:text-white p-3 sm:p-4 rounded-full shadow-2xl transition active:scale-95 items-center justify-center cursor-pointer select-none">
            ‹
        </button>

        <div id="zoom-modal-content" onclick="event.stopPropagation()" class="bg-transparent border-none shadow-none p-2 sm:p-4 max-w-md w-full max-h-[95vh] flex flex-col items-center relative transform scale-95 transition-transform duration-300">
            <!-- Conteúdo injetado via JS -->
        </div>

        <!-- Botão Avançar Externo -->
        <button id="zoom-next-btn" onclick="event.stopPropagation(); nextZoomCard()" class="hidden sm:flex absolute right-4 sm:right-8 lg:right-16 top-1/2 -translate-y-1/2 z-40 glass-panel hover:bg-cinder-orange disabled:opacity-20 text-cinder-orange dark:text-cinder-yellow hover:text-white p-3 sm:p-4 rounded-full shadow-2xl transition active:scale-95 items-center justify-center cursor-pointer select-none">
            ›
        </button>
    </div>

    <!-- HEADER DE NAVEGAÇÃO GLASSMORPHISM -->
    <header class="p-3 sm:p-4 glass-panel sticky top-0 z-50 transition-colors duration-200 border-b border-white/10">
        <div class="max-w-7xl mx-auto flex flex-col gap-2.5">
            
            <div class="flex justify-between items-center w-full">
                
                <h1 onclick="switchTab('dashboard')" class="text-lg sm:text-xl font-black text-cinder-orange tracking-tight cursor-pointer hover:opacity-85 transition flex items-center gap-2 select-none">
                    <span class="w-3 h-3 rounded-full bg-gradient-to-r from-cinder-orange to-cinder-yellow shadow-lg shadow-cinder-orange/50"></span>
                    MasterSet
                </h1>

                <nav class="hidden md:flex items-center gap-1.5 glass-card p-1 rounded-2xl text-xs font-semibold">
                    <button id="nav-dashboard" onclick="switchTab('dashboard')" class="px-3.5 py-1.5 rounded-xl transition hover:text-cinder-orange dark:hover:text-cinder-yellow">
                        Resumo
                    </button>
                    <button id="nav-grid" onclick="switchTab('grid')" class="px-3.5 py-1.5 rounded-xl transition hover:text-cinder-orange dark:hover:text-cinder-yellow">
                        Coleção
                    </button>
                    <button id="nav-capture" onclick="switchTab('capture')" class="px-3.5 py-1.5 rounded-xl transition hover:text-cinder-orange dark:hover:text-cinder-yellow">
                        Captura
                    </button>
                    <button id="nav-market" onclick="switchTab('market')" class="px-3.5 py-1.5 rounded-xl transition hover:text-cinder-orange dark:hover:text-cinder-yellow">
                        Mercado
                    </button>
                </nav>

                <div class="flex items-center gap-2 sm:gap-3">
                    
                    <!-- TOGGLE SWITCH TEMA -->
                    <button onclick="toggleTheme()" aria-label="Alternar Tema" class="theme-switch-track relative w-12 sm:w-14 h-6 sm:h-7 rounded-full bg-slate-200 dark:bg-[#121926] border border-slate-300 dark:border-white/10 transition-colors duration-300 flex items-center px-1 shrink-0 overflow-hidden cursor-pointer shadow-inner">
                        <svg class="absolute right-1.5 w-3.5 h-3.5 text-slate-400 dark:opacity-0 transition-opacity duration-300 pointer-events-none" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zm0 8c-1.65 0-3-1.35-3-3s1.35-3 3-3 3 1.35 3 3-1.35 3-3 3zm0-13C11.45 2 11 2.45 11 3v2c0 .55.45 1 1 1s1-.45 1-1V3c0-.55-.45-1-1-1zm0 16c-.55 0-1 .45-1 1v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1zm9-9c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1h2zM5 12c0-.55-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1h2c.55 0 1-.45 1-1zm14.36-6.36c.39-.39.39-1.02 0-1.41s-1.02-.39-1.41 0l-1.41 1.41c-.39.39-.39 1.02 0 1.41.39.39 1.02.39 1.41 0l1.41-1.41zM7.05 18.36c-.39-.39-1.02-.39-1.41 0l-1.41 1.41c-.39.39-.39 1.02 0 1.41.39.39 1.02.39 1.41 0l1.41-1.41c.39-.38.39-1.02 0-1.41zM18.36 18.36l1.41 1.41c.39.39 1.02.39 1.41 0s.39-1.02 0-1.41l-1.41-1.41c-.39-.39-1.02-.39-1.41 0s-.39 1.02 0 1.41zM6.34 5.64L4.93 4.23c-.39-.39-1.02-.39-1.41 0s-.39 1.02 0 1.41l1.41 1.41c.39.39 1.02.39 1.41 0s.39-1.02 0-1.41z"/>
                        </svg>

                        <div class="absolute left-1 opacity-0 dark:opacity-100 transition-opacity duration-300 pointer-events-none flex items-center gap-0.5 text-slate-400">
                            <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 24 24">
                                <path d="M12.3 2a10 10 0 0 0-1.9 20 10 10 0 0 0 10-10 10 10 0 0 0-8.1-10zm-1.1 17.9a8 8 0 1 1 6.7-11.2 8.05 8.05 0 0 1-6.7 11.2z"/>
                            </svg>
                        </div>

                        <div class="theme-switch-thumb w-4.5 sm:w-5 h-4.5 sm:h-5 rounded-full bg-white dark:bg-[#253247] transform transition-transform duration-300 translate-x-0 dark:translate-x-6 sm:dark:translate-x-7 z-10"></div>
                    </button>

                    <div class="flex gap-1.5 sm:gap-2">
                        <div class="glass-card px-2.5 py-1 rounded-xl text-center border border-white/10">
                            <p class="text-[7px] sm:text-[9px] text-slate-400 uppercase font-bold">Total</p>
                            <p id="total-count" class="text-xs sm:text-sm font-extrabold text-slate-800 dark:text-cinder-white">226</p>
                        </div>
                        <div class="glass-card px-2.5 py-1 rounded-xl text-center border-l-2 border-green-500 shadow-sm">
                            <p class="text-[7px] sm:text-[9px] text-slate-400 uppercase font-bold">Tenho</p>
                            <p id="obtained-count" class="text-xs sm:text-sm font-extrabold text-green-600 dark:text-green-400">0</p>
                        </div>
                        <div class="glass-card px-2.5 py-1 rounded-xl text-center border-l-2 border-cinder-orange shadow-sm">
                            <p class="text-[7px] sm:text-[9px] text-slate-400 uppercase font-bold">Faltam</p>
                            <p id="missing-count" class="text-xs sm:text-sm font-extrabold text-cinder-orange dark:text-cinder-yellow">226</p>
                        </div>
                    </div>

                    <button id="hamburger-btn" onclick="toggleMobileMenu()" aria-label="Abrir Menu" class="md:hidden glass-card hover:bg-slate-200 dark:hover:bg-white/10 active:scale-95 text-slate-800 dark:text-cinder-white p-2 rounded-xl transition flex flex-col justify-center items-center gap-1 w-8 h-8 shrink-0">
                        <span class="w-4 h-0.5 bg-cinder-orange dark:bg-cinder-yellow rounded-full transition-all"></span>
                        <span class="w-4 h-0.5 bg-cinder-orange dark:bg-cinder-yellow rounded-full transition-all"></span>
                        <span class="w-4 h-0.5 bg-cinder-orange dark:bg-cinder-yellow rounded-full transition-all"></span>
                    </button>
                </div>
            </div>

            <div id="mobile-menu" class="hidden md:hidden flex-col gap-1.5 pt-2 border-t border-white/10 animate-fade-in">
                <p class="text-[10px] uppercase tracking-wider font-extrabold text-cinder-orange dark:text-cinder-yellow px-1">Navegação</p>
                <div class="grid grid-cols-2 gap-1.5">
                    <button id="mob-nav-dashboard" onclick="switchTab('dashboard')" class="glass-card p-2.5 rounded-xl text-xs font-bold text-left border border-white/10 transition">
                        Resumo
                    </button>
                    <button id="mob-nav-grid" onclick="switchTab('grid')" class="glass-card p-2.5 rounded-xl text-xs font-bold text-left border border-white/10 transition">
                        Coleção
                    </button>
                    <button id="mob-nav-capture" onclick="switchTab('capture')" class="glass-card p-2.5 rounded-xl text-xs font-bold text-left border border-white/10 transition">
                        Captura
                    </button>
                    <button id="mob-nav-market" onclick="switchTab('market')" class="glass-card p-2.5 rounded-xl text-xs font-bold text-left border border-white/10 transition">
                        Mercado
                    </button>
                </div>
            </div>

        </div>
    </header>

    <main class="p-3 sm:p-6 max-w-7xl mx-auto">

        <!-- BARRA DE FILTROS GLASSMORPHISM -->
        <div id="filter-control-bar" class="flex flex-wrap justify-between items-center mb-4 gap-2.5 relative hidden glass-panel py-3 px-4 rounded-3xl shadow-xl">
            <div class="flex items-center gap-2.5 flex-1 max-w-2xl relative">
                <button onclick="toggleFilterDrawer()" class="glass-card hover:bg-white/10 text-slate-800 dark:text-cinder-white px-3.5 py-2 rounded-2xl text-xs font-bold flex items-center gap-2 transition shadow-md shrink-0 cursor-pointer border border-white/10">
                    <span>Filtros</span>
                    <span id="drawer-arrow" class="transform transition duration-200 text-cinder-orange dark:text-cinder-yellow">▼</span>
                </button>

                <input id="search-input" oninput="handleSearchInput()" type="text" placeholder="Buscar por Nome, expansão ou variante..." class="w-full glass-card px-4 py-2 rounded-2xl text-xs outline-none focus:border-cinder-orange text-slate-800 dark:text-cinder-white shadow-inner border border-white/10">

                <section id="filters
