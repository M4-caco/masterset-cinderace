<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex Master Set Tracker - Família Cinderace</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    colors: {
                        pokeRed: '#FF3E3E',
                        pokeDarkRed: '#CC1111',
                        pokeOrange: '#FF7A00',
                        glassBg: 'rgba(255, 255, 255, 0.65)',
                        glassBorder: 'rgba(255, 255, 255, 0.4)',
                        darkGlassBg: 'rgba(15, 23, 42, 0.75)',
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            min-height: 100vh;
            color: #f8fafc;
        }

        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .glass-card {
            background: rgba(30, 41, 59, 0.55);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-card:hover {
            border-color: rgba(249, 115, 22, 0.4);
            box-shadow: 0 10px 25px -5px rgba(249, 115, 22, 0.15);
        }

        /* 3D Tilt Effect Container */
        .tilt-card {
            transform-style: preserve-3d;
            perspective: 1000px;
        }

        .tilt-card-inner {
            transition: transform 0.15s ease-out;
            transform-style: preserve-3d;
        }

        /* Holographic Shimmer Effect */
        .holo-overlay {
            background: linear-gradient(115deg, transparent 20%, rgba(255, 255, 255, 0.25) 40%, rgba(255, 255, 255, 0.5) 50%, rgba(255, 255, 255, 0.25) 60%, transparent 80%);
            mix-blend-mode: color-dodge;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        .tilt-card:hover .holo-overlay {
            opacity: 0.6;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(249, 115, 22, 0.4);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(249, 115, 22, 0.7);
        }
    </style>
</head>
<body class="font-sans antialiased text-slate-100 min-h-screen pb-12 selection:bg-orange-500 selection:text-white">

    <!-- Header Navigation Bar -->
    <header class="sticky top-0 z-40 glass-panel border-b border-slate-700/50 mb-6">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-20">
                <!-- Brand Title -->
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-orange-600 to-amber-400 flex items-center justify-center shadow-lg shadow-orange-500/30">
                        <i class="fa-solid font-bold text-white text-xl">🔥</i>
                    </div>
                    <div>
                        <h1 class="text-xl font-extrabold tracking-tight bg-gradient-to-r from-orange-400 via-amber-200 to-yellow-400 bg-clip-text text-transparent">
                            Cinderace Master Set Tracker
                        </h1>
                        <p class="text-xs text-slate-400 font-medium">Coleção Família Scorbunny & Cinderace</p>
                    </div>
                </div>

                <!-- Collection Overall Stats -->
                <div class="hidden md:flex items-center space-x-6">
                    <div class="text-right">
                        <span class="text-xs text-slate-400 uppercase tracking-wider block font-semibold">Progresso Total</span>
                        <span id="stat-total-progress" class="text-lg font-bold text-orange-400">0 / 0 (0%)</span>
                    </div>
                    <div class="w-32 bg-slate-800/80 rounded-full h-3 p-0.5 border border-slate-700">
                        <div id="stat-progress-bar" class="bg-gradient-to-r from-orange-500 to-amber-400 h-full rounded-full transition-all duration-500" style="width: 0%"></div>
                    </div>
                </div>

                <!-- Admin Lock Toggle Button -->
                <button id="lock-toggle-btn" onclick="toggleLockState()" class="flex items-center space-x-2 px-4 py-2 rounded-xl bg-slate-800/80 hover:bg-slate-700 border border-slate-700 text-slate-300 hover:text-white transition-all shadow-sm">
                    <i id="lock-icon" class="fa-solid fa-lock text-amber-400"></i>
                    <span id="lock-text" class="text-xs font-semibold">Modo Leitura</span>
                </button>
            </div>
        </div>

        <!-- Navigation Tabs -->
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex space-x-2 border-t border-slate-800/60 pt-2 pb-2">
            <button onclick="switchTab('capturas')" id="tab-btn-capturas" class="tab-btn px-5 py-2.5 rounded-lg text-sm font-bold transition-all flex items-center space-x-2 bg-orange-500/20 text-orange-400 border border-orange-500/30 shadow-inner">
                <i class="fa-solid fa-cards-blank"></i>
                <span>Capturas (<span id="capturas-count">0</span>)</span>
            </button>
            <button onclick="switchTab('wishlist')" id="tab-btn-wishlist" class="tab-btn px-5 py-2.5 rounded-lg text-sm font-bold text-slate-400 hover:text-slate-200 hover:bg-slate-800/50 transition-all flex items-center space-x-2 border border-transparent">
                <i class="fa-solid fa-heart"></i>
                <span>Wishlist (<span id="wishlist-count">0</span>)</span>
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">

        <!-- TAB: CAPTURAS -->
        <section id="tab-capturas" class="tab-content space-y-6">
            
            <!-- Filters Toolbar -->
            <div class="glass-panel p-4 rounded-2xl flex flex-col md:flex-row gap-4 justify-between items-center">
                <!-- Search Box -->
                <div class="relative w-full md:w-80">
                    <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                    <input type="text" id="search-capturas" oninput="applyFilters()" placeholder="Buscar nome, coleção, código..." class="w-full bg-slate-900/60 text-sm pl-10 pr-4 py-2.5 rounded-xl border border-slate-700/80 focus:outline-none focus:border-orange-500 text-slate-200 placeholder-slate-500">
                </div>

                <!-- Dropdown Select Filters -->
                <div class="flex flex-wrap items-center gap-3 w-full md:w-auto">
                    <!-- Filter Pokemon -->
                    <select id="filter-pokemon" onchange="applyFilters()" class="bg-slate-900/60 border border-slate-700/80 text-slate-300 text-xs rounded-xl px-3 py-2.5 focus:outline-none focus:border-orange-500">
                        <option value="">Todos os Pokémon</option>
                        <option value="Scorbunny">Scorbunny</option>
                        <option value="Raboot">Raboot</option>
                        <option value="Cinderace">Cinderace</option>
                    </select>

                    <!-- Filter Idioma -->
                    <select id="filter-idioma" onchange="applyFilters()" class="bg-slate-900/60 border border-slate-700/80 text-slate-300 text-xs rounded-xl px-3 py-2.5 focus:outline-none focus:border-orange-500">
                        <option value="">Todos os Idiomas</option>
                        <option value="PT">Português (PT)</option>
                        <option value="EN">Inglês (EN)</option>
                        <option value="JP">Japonês (JP)</option>
                        <option value="ES">Espanhol (ES)</option>
                        <option value="CN">Chinês (CN)</option>
                    </select>

                    <!-- Filter Raridade/Variante -->
                    <select id="filter-variante" onchange="applyFilters()" class="bg-slate-900/60 border border-slate-700/80 text-slate-300 text-xs rounded-xl px-3 py-2.5 focus:outline-none focus:border-orange-500">
                        <option value="">Todas Variantes</option>
                        <option value="Regular">Regular / Holo</option>
                        <option value="Reverse Holo">Reverse Holo</option>
                        <option value="Pokeball Reverse">Pokeball Reverse</option>
                        <option value="Masterball Reverse">Masterball Reverse</option>
                        <option value="Promo">Promo</option>
                        <option value="Secret / AR">Secret / AR / SAR</option>
                    </select>

                    <!-- Filter Status Quantidade -->
                    <select id="filter-status" onchange="applyFilters()" class="bg-slate-900/60 border border-slate-700/80 text-slate-300 text-xs rounded-xl px-3 py-2.5 focus:outline-none focus:border-orange-500">
                        <option value="">Status Geral</option>
                        <option value="possuida">Possuídas (>0)</option>
                        <option value="faltante">Faltantes (=0)</option>
                    </select>
                </div>
            </div>

            <!-- Cards Grid (Capturas) -->
            <div id="grid-capturas" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                <!-- Dynamically populated -->
            </div>
        </section>

        <!-- TAB: WISHLIST -->
        <section id="tab-wishlist" class="tab-content hidden space-y-6">
            <div class="glass-panel p-4 rounded-2xl flex justify-between items-center">
                <div>
                    <h2 class="text-lg font-bold text-slate-200">Lista de Desejos & Prioridades</h2>
                    <p class="text-xs text-slate-400">Cartas que você está procurando para completar o Master Set.</p>
                </div>
            </div>

            <!-- Cards Grid (Wishlist) -->
            <div id="grid-wishlist" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                <!-- Dynamically populated -->
            </div>
        </section>
    </main>

    <!-- Modal Zoom Preview (3D Tilt & Touch Swipe) -->
    <div id="card-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md transition-all duration-300">
        <div class="relative w-full max-w-sm glass-panel rounded-3xl p-6 text-center space-y-4 border border-slate-700/60 shadow-2xl">
            <!-- Close Modal Button -->
            <button onclick="closeModal()" class="absolute top-4 right-4 w-9 h-9 rounded-full bg-slate-800/80 hover:bg-slate-700 text-slate-400 hover:text-white flex items-center justify-center border border-slate-700 transition-all">
                <i class="fa-solid fa-xmark"></i>
            </button>

            <h3 id="modal-card-title" class="text-lg font-extrabold text-orange-400">Nome da Carta</h3>
            <p id="modal-card-subtitle" class="text-xs text-slate-400">Coleção - #000/000</p>

            <!-- 3D Interactive Card Frame -->
            <div id="modal-tilt-container" class="tilt-card my-4 mx-auto w-64 h-88 cursor-grab active:cursor-grabbing">
                <div id="modal-tilt-inner" class="tilt-card-inner relative w-full h-full rounded-2xl overflow-hidden shadow-2xl border border-slate-600/40">
                    <img id="modal-card-image" src="" alt="Card Zoom" class="w-full h-full object-cover">
                    <div class="holo-overlay absolute inset-0"></div>
                </div>
            </div>

            <p class="text-[11px] text-slate-500 italic">Dica: Movimente o mouse ou deslize o dedo para efeito holográfico 3D.</p>
        </div>
    </div>

    <!-- Application Script Logic -->
    <script>
        // Default Mock Cards Database
        const initialCards = [
            {
                id: 'c1',
                nome: 'Scorbunny',
                pokemon: 'Scorbunny',
                colecao: 'Espada e Escudo',
                codigo: '031/202',
                idioma: 'PT',
                variante: 'Regular',
                quantidade: 2,
                wishlist: false,
                imagem: 'https://images.pokemontcg.io/swsh1/31_hires.png'
            },
            {
                id: 'c2',
                nome: 'Raboot',
                pokemon: 'Raboot',
                colecao: 'Espada e Escudo',
                codigo: '032/202',
                idioma: 'EN',
                variante: 'Reverse Holo',
                quantidade: 1,
                wishlist: false,
                imagem: 'https://images.pokemontcg.io/swsh1/32_hires.png'
            },
            {
                id: 'c3',
                nome: 'Cinderace VMAX',
                pokemon: 'Cinderace',
                colecao: 'Rivalidade Rebelde',
                codigo: '036/192',
                idioma: 'JP',
                variante: 'Secret / AR',
                quantidade: 0,
                wishlist: true,
                imagem: 'https://images.pokemontcg.io/swsh2/36_hires.png'
            },
            {
                id: 'c4',
                nome: 'Cinderace',
                pokemon: 'Cinderace',
                colecao: 'Destinos Brilhantes',
                codigo: 'SV017/SV122',
                idioma: 'PT',
                variante: 'Masterball Reverse',
                quantidade: 1,
                wishlist: false,
                imagem: 'https://images.pokemontcg.io/swsh45sv/SV017_hires.png'
            },
            {
                id: 'c5',
                nome: 'Scorbunny Promo',
                pokemon: 'Scorbunny',
                colecao: 'SWSH Promos',
                codigo: 'SWSH071',
                idioma: 'ES',
                variante: 'Promo',
                quantidade: 0,
                wishlist: true,
                imagem: 'https://images.pokemontcg.io/swshp/SWSH071_hires.png'
            }
        ];

        // State Variables
        let cards = JSON.parse(localStorage.getItem('cinderace_cards')) || initialCards;
        let isLocked = true; // Lock state default: Read-Only

        // Language Flag Icons (SVG/Emoji helper)
        function getLanguageBadgeHtml(idioma) {
            const flags = {
                'PT': '<span class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-md bg-slate-800 border border-slate-700 text-xs font-bold text-emerald-400">🇧🇷 PT</span>',
                'EN': '<span class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-md bg-slate-800 border border-slate-700 text-xs font-bold text-blue-400">🇺🇸 EN</span>',
                'JP': '<span class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-md bg-slate-800 border border-slate-700 text-xs font-bold text-red-400">🇯🇵 JP</span>',
                'ES': '<span class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-md bg-slate-800 border border-slate-700 text-xs font-bold text-amber-400">🇪🇸 ES</span>',
                'CN': '<span class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-md bg-slate-800 border border-slate-700 text-xs font-bold text-yellow-500">🇨🇳 CN</span>'
            };
            return flags[idioma] || `<span class="inline-flex items-center px-2 py-0.5 rounded-md bg-slate-800 border border-slate-700 text-xs font-bold text-slate-300">🌐 ${idioma}</span>`;
        }

        // Variant Pill Styling Helper
        function getVariantBadgeHtml(variante) {
            const styles = {
                'Regular': 'bg-slate-800/80 text-slate-300 border-slate-700',
                'Reverse Holo': 'bg-purple-900/40 text-purple-300 border-purple-700/50',
                'Pokeball Reverse': 'bg-red-900/40 text-red-300 border-red-700/50',
                'Masterball Reverse': 'bg-indigo-900/40 text-indigo-300 border-indigo-700/50',
                'Promo': 'bg-amber-900/40 text-amber-300 border-amber-700/50',
                'Secret / AR': 'bg-gradient-to-r from-pink-500/20 to-rose-500/20 text-rose-300 border-rose-500/30'
            };
            const classStyle = styles[variante] || 'bg-slate-800 text-slate-300 border-slate-700';
            return `<span class="inline-block text-[10px] font-semibold tracking-wide uppercase px-2 py-1 rounded-lg border ${classStyle} truncate max-w-full text-center">${variante}</span>`;
        }

        // Initialize App
        window.addEventListener('DOMContentLoaded', () => {
            saveToStorage();
            renderCards();
            updateStats();
            setup3DTilt();
        });

        // Save State
        function saveToStorage() {
            localStorage.setItem('cinderace_cards', JSON.stringify(cards));
        }

        // Toggle Admin/Lock Mode
        function toggleLockState() {
            isLocked = !isLocked;
            const icon = document.getElementById('lock-icon');
            const text = document.getElementById('lock-text');
            const btn = document.getElementById('lock-toggle-btn');

            if (isLocked) {
                icon.className = 'fa-solid fa-lock text-amber-400';
                text.textContent = 'Modo Leitura';
                btn.classList.remove('border-emerald-500/50', 'bg-emerald-900/20');
            } else {
                icon.className = 'fa-solid fa-lock-open text-emerald-400';
                text.textContent = 'Edição Liberada';
                btn.classList.add('border-emerald-500/50', 'bg-emerald-900/20');
            }

            renderCards();
        }

        // Switch Tabs
        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('bg-orange-500/20', 'text-orange-400', 'border-orange-500/30', 'shadow-inner');
                btn.classList.add('text-slate-400', 'border-transparent');
            });

            document.getElementById(`tab-${tab}`).classList.remove('hidden');
            const activeBtn = document.getElementById(`tab-btn-${tab}`);
            activeBtn.classList.add('bg-orange-500/20', 'text-orange-400', 'border-orange-500/30', 'shadow-inner');
            activeBtn.classList.remove('text-slate-400', 'border-transparent');
        }

        // Update Counter Stats
        function updateStats() {
            const total = cards.length;
            const owned = cards.filter(c => c.quantidade > 0).length;
            const wishlistCount = cards.filter(c => c.wishlist).length;
            const percentage = total > 0 ? Math.round((owned / total) * 100) : 0;

            document.getElementById('stat-total-progress').textContent = `${owned} / ${total} (${percentage}%)`;
            document.getElementById('stat-progress-bar').style.width = `${percentage}%`;
            document.getElementById('capturas-count').textContent = total;
            document.getElementById('wishlist-count').textContent = wishlistCount;
        }

        // Render Cards Grid
        function renderCards() {
            const gridCapturas = document.getElementById('grid-capturas');
            const gridWishlist = document.getElementById('grid-wishlist');

            const filteredCards = filterCardData(cards);

            gridCapturas.innerHTML = '';
            gridWishlist.innerHTML = '';

            filteredCards.forEach(card => {
                // CAPTURAS CARD (NEW NO-HEADER LEFT-COLUMN LAYOUT)
                const cardEl = document.createElement('div');
                cardEl.className = `glass-card rounded-2xl p-4 flex gap-4 items-start relative overflow-hidden ${card.quantidade === 0 ? 'opacity-75 grayscale-[30%]' : ''}`;
                
                cardEl.innerHTML = `
                    <!-- Coluna da Esquerda: Imagem da Carta + Idioma + Raridade -->
                    <div class="w-28 flex-shrink-0 flex flex-col items-center space-y-2">
                        <div onclick="openModal('${card.id}')" class="w-full h-38 rounded-xl overflow-hidden cursor-pointer group relative shadow-md bg-slate-900 border border-slate-700/60">
                            <img src="${card.imagem}" alt="${card.nome}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" onerror="this.src='https://placehold.co/200x280/1e293b/f8fafc?text=Carta+Pokémon'">
                            <div class="absolute inset-0 bg-black/20 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                                <i class="fa-solid fa-expand text-white text-lg"></i>
                            </div>
                        </div>

                        <!-- Espaço aproveitado para Idioma e Raridade/Variante abaixo da imagem -->
                        <div class="w-full flex flex-col gap-1.5 items-center">
                            ${getLanguageBadgeHtml(card.idioma)}
                            ${getVariantBadgeHtml(card.variante)}
                        </div>
                    </div>

                    <!-- Coluna da Direita: Nome, Coleção, Código e Controles -->
                    <div class="flex-1 flex flex-col justify-between h-full min-w-0">
                        <div class="space-y-1">
                            <!-- Nome da Carta sem elementos sobrepostos -->
                            <h3 class="font-extrabold text-base text-slate-100 truncate tracking-tight" title="${card.nome}">${card.nome}</h3>
                            <p class="text-xs font-medium text-orange-400/90 truncate">${card.colecao}</p>
                            <p class="text-[11px] font-mono text-slate-400">${card.codigo}</p>
                        </div>

                        <!-- Quantidade e Ações -->
                        <div class="mt-4 pt-3 border-t border-slate-700/50 flex items-center justify-between">
                            <div class="flex items-center space-x-2">
                                <button onclick="changeQuantity('${card.id}', -1)" ${isLocked ? 'disabled' : ''} class="w-7 h-7 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 flex items-center justify-center text-xs font-bold transition-all disabled:opacity-40 disabled:cursor-not-allowed">
                                    <i class="fa-solid fa-minus"></i>
                                </button>
                                <span class="text-sm font-extrabold px-2 text-amber-300">${card.quantidade}</span>
                                <button onclick="changeQuantity('${card.id}', 1)" ${isLocked ? 'disabled' : ''} class="w-7 h-7 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 flex items-center justify-center text-xs font-bold transition-all disabled:opacity-40 disabled:cursor-not-allowed">
                                    <i class="fa-solid fa-plus"></i>
                                </button>
                            </div>

                            <!-- Botão Wishlist Toggle -->
                            <button onclick="toggleWishlist('${card.id}')" ${isLocked ? 'disabled' : ''} class="w-8 h-8 rounded-lg flex items-center justify-center text-sm transition-all ${card.wishlist ? 'text-rose-500 bg-rose-500/10 border border-rose-500/30' : 'text-slate-500 bg-slate-800 hover:text-slate-300'} disabled:opacity-50">
                                <i class="${card.wishlist ? 'fa-solid fa-heart' : 'fa-regular fa-heart'}"></i>
                            </button>
                        </div>
                    </div>
                `;
                gridCapturas.appendChild(cardEl);

                // WISHLIST TAB GRID
                if (card.wishlist) {
                    const wishEl = document.createElement('div');
                    wishEl.className = 'glass-card rounded-2xl p-4 flex gap-4 items-center border-l-4 border-l-rose-500';
                    wishEl.innerHTML = `
                        <img src="${card.imagem}" alt="${card.nome}" class="w-16 h-22 object-cover rounded-lg border border-slate-700">
                        <div class="flex-1 min-w-0">
                            <h4 class="font-bold text-slate-200 truncate">${card.nome}</h4>
                            <p class="text-xs text-orange-400">${card.colecao} (${card.codigo})</p>
                            <div class="flex items-center gap-2 mt-2">
                                ${getLanguageBadgeHtml(card.idioma)}
                                ${getVariantBadgeHtml(card.variante)}
                            </div>
                        </div>
                        <button onclick="toggleWishlist('${card.id}')" ${isLocked ? 'disabled' : ''} class="text-rose-400 hover:text-rose-300 p-2 disabled:opacity-40">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    `;
                    gridWishlist.appendChild(wishEl);
                }
            });

            if (gridWishlist.children.length === 0) {
                gridWishlist.innerHTML = `<div class="col-span-full text-center py-12 text-slate-500 text-sm">Nenhuma carta adicionada à Wishlist no momento.</div>`;
            }
        }

        // Apply Search & Dropdown Filters
        function filterCardData(data) {
            const search = document.getElementById('search-capturas').value.toLowerCase();
            const pokemon = document.getElementById('filter-pokemon').value;
            const idioma = document.getElementById('filter-idioma').value;
            const variante = document.getElementById('filter-variante').value;
            const status = document.getElementById('filter-status').value;

            return data.filter(c => {
                const matchesSearch = c.nome.toLowerCase().includes(search) || c.colecao.toLowerCase().includes(search) || c.codigo.toLowerCase().includes(search);
                const matchesPokemon = !pokemon || c.pokemon === pokemon;
                const matchesIdioma = !idioma || c.idioma === idioma;
                const matchesVariante = !variante || c.variante === variante;
                const matchesStatus = !status || (status === 'possuida' ? c.quantidade > 0 : c.quantidade === 0);

                return matchesSearch && matchesPokemon && matchesIdioma && matchesVariante && matchesStatus;
            });

            applyFilters();
        }

        function applyFilters() {
            renderCards();
        }

        // Quantity Modifiers
        function changeQuantity(id, delta) {
            if (isLocked) return;
            const card = cards.find(c => c.id === id);
            if (card) {
                card.quantidade = Math.max(0, card.quantidade + delta);
                saveToStorage();
                renderCards();
                updateStats();
            }
        }

        // Wishlist Toggle
        function toggleWishlist(id) {
            if (isLocked) return;
            const card = cards.find(c => c.id === id);
            if (card) {
                card.wishlist = !card.wishlist;
                saveToStorage();
                renderCards();
                updateStats();
            }
        }

        // Modal Functions
        function openModal(id) {
            const card = cards.find(c => c.id === id);
            if (!card) return;

            document.getElementById('modal-card-title').textContent = card.nome;
            document.getElementById('modal-card-subtitle').textContent = `${card.colecao} • ${card.codigo}`;
            document.getElementById('modal-card-image').src = card.imagem;

            document.getElementById('card-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('card-modal').classList.add('hidden');
        }

        // 3D Tilt Effect Interactivity
        function setup3DTilt() {
            const container = document.getElementById('modal-tilt-container');
            const inner = document.getElementById('modal-tilt-inner');

            if (!container || !inner) return;

            container.addEventListener('mousemove', (e) => {
                const rect = container.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;

                const centerX = rect.width / 2;
                const centerY = rect.height / 2;

                const rotateX = ((y - centerY) / centerY) * -18;
                const rotateY = ((x - centerX) / centerX) * 18;

                inner.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.03)`;
            });

            container.addEventListener('mouseleave', () => {
                inner.style.transform = 'rotateX(0deg) rotateY(0deg) scale(1)';
            });

            // Touch support for mobile swipe/tilt
            container.addEventListener('touchmove', (e) => {
                if (e.touches.length > 0) {
                    const touch = e.touches[0];
                    const rect = container.getBoundingClientRect();
                    const x = touch.clientX - rect.left;
                    const y = touch.clientY - rect.top;

                    const centerX = rect.width / 2;
                    const centerY = rect.height / 2;

                    const rotateX = ((y - centerY) / centerY) * -15;
                    const rotateY = ((x - centerX) / centerX) * 15;

                    inner.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
                }
            });

            container.addEventListener('touchend', () => {
                inner.style.transform = 'rotateX(0deg) rotateY(0deg) scale(1)';
            });
        }
    </script>
</body>
</html>
